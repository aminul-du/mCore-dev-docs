version: "1.0.0"
date: "2026-09-29"
authority: AIS
classification: proposed

services:
  - id: engine
    hostname: engine.mcore360.com
    origin: "127.0.0.1:8787"
    access: "Cloudflare Access + MFA"
    connectivity: "Cloudflare Tunnel"
    environment: prod
    status: proposed
    exposure_policy: authenticated
    forbidden_exposures:
      - "public inbound 8787"
      - "unauthenticated /status"
      - "unauthenticated /backups"
      - "unauthenticated /manifest"
      - "unauthenticated /dashboard"
